name: ml-machine-gateway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_IP}:80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/routes:/etc/nginx/routes:ro
      - ./secrets:/etc/nginx/secrets:ro
    networks: [public, private]

networks:
  public:
  private:
    name: ml-machine-gateway-private

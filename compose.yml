name: ml-machine-gateway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Production: 192.168.0.189:80. Local test: 127.0.0.1:8098.
      - "${GATEWAY_BIND}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/routes:/etc/nginx/routes:ro
      - ./secrets:/etc/nginx/secrets:ro
    networks: [public, private]

networks:
  public:
  private:
    name: ml-machine-gateway-private

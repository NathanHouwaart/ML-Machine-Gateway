# One authenticated, read-only data portal. Machine selection happens inside
# the application at /data/, avoiding a separate route for every machine.
location = /data {
    return 308 /data/;
}

location /data/api/ {
    auth_basic "MaintenanceLab machine data";
    auth_basic_user_file /etc/nginx/secrets/machine-data.htpasswd;
    set $machine_data_api_upstream testbench-portal-api:8000;
    rewrite ^/data/(.*)$ /$1 break;
    proxy_pass http://$machine_data_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /data/ {
    auth_basic "MaintenanceLab machine data";
    auth_basic_user_file /etc/nginx/secrets/machine-data.htpasswd;
    set $machine_data_upstream testbench-portal-web:80;
    rewrite ^/data/(.*)$ /$1 break;
    proxy_pass http://$machine_data_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

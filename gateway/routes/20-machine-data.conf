# One generic route supports every present and future machine. The portal
# itself validates the requested machine against its server-side data folders.
location ~ ^/[a-z0-9-]+/machine-data$ {
    return 308 $uri/;
}

location ~ ^/[a-z0-9-]+/machine-data/api/(.*)$ {
    auth_basic "MaintenanceLab machine data";
    auth_basic_user_file /etc/nginx/secrets/machine-data.htpasswd;

    # The API receives its normal /api/... path. The browser keeps the machine
    # prefix, which prevents a request from leaking into another application.
    set $machine_data_api_upstream testbench-portal-api:8000;
    rewrite ^/[a-z0-9-]+/machine-data/api/(.*)$ /api/$1 break;
    proxy_pass http://$machine_data_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/[a-z0-9-]+/machine-data/(.*)$ {
    auth_basic "MaintenanceLab machine data";
    auth_basic_user_file /etc/nginx/secrets/machine-data.htpasswd;

    # Strip the public machine prefix before passing assets and the SPA to its
    # own container. The portal uses relative URLs to retain that prefix.
    set $machine_data_upstream testbench-portal-web:80;
    rewrite ^/[a-z0-9-]+/machine-data/(.*)$ /$1 break;
    proxy_pass http://$machine_data_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# One generic route supports every present and future machine. The portal
# itself validates the requested machine against its server-side data folders.
location ~ ^/[a-z0-9-]+/machine-data$ {
    return 308 $uri/;
}

location ~ ^/[a-z0-9-]+/machine-data/(.*)$ {
    auth_basic "MaintenanceLab machine data";
    auth_basic_user_file /etc/nginx/secrets/machine-data.htpasswd;

    # Strip /MACHINE/machine-data/ before forwarding. Browser-visible URLs stay
    # unchanged, allowing the React portal to determine its machine identity.
    rewrite ^/[a-z0-9-]+/machine-data/(.*)$ /$1 break;
    set $machine_data_upstream testbench-portal-web:80;
    proxy_pass http://$machine_data_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

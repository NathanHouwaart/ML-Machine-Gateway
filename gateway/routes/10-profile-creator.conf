# Profile Creator stays a separate application but is published through the
# same public gateway. Its own frontend proxies /knarskast/api to profile-api.
location = /knarskast {
    return 308 /knarskast/;
}

location /knarskast/ {
    set $profile_creator_upstream profile-web:80;
    proxy_pass http://$profile_creator_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

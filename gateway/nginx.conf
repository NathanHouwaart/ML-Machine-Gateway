events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr $remote_user [$time_local] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  # Docker's embedded DNS permits services to be added/replaced without
  # restarting the gateway. Routes return 502 until their target is enabled.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    location = /health { return 200 "ML Machine Gateway healthy\n"; }
    include /etc/nginx/routes/*.conf;
    location / { return 404; }
  }
}
